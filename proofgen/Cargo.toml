[package]
name = "proofgen51"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
solana-zk-sdk = "5.0.1"
curve25519-dalek = "4.1.3"
merlin = "3"
base64 = "0.22"
hex = "0.4"
bytemuck = "1"
serde_json = "1"
sha3 = "0.10"
hmac = "0.12"
sha2 = "0.10"
# Custom getrandom backend: the browser provides `__lk_getrandom` (a thin
# wrapper over crypto.getRandomValues), so we avoid the wasm-bindgen glue that
# the `js` feature pulls in (which panics under the UI's no-op import shim).
getrandom = { version = "0.2", features = ["custom"] }
aes-gcm-siv = { version = "0.11.1", features = ["alloc", "aes"] }
